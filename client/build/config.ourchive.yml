# Canonical Wails build configuration for the Ourchive desktop client.
#
# `scripts/bootstrap-build-assets.sh` copies this to build/config.yml and generates the platform
# build assets (Taskfiles, Info.plist, NSIS installer, .desktop file, icons) from it. Edit this
# file, not build/config.yml, then run `wails3 task common:update:build-assets`.
version: '3'

info:
  companyName: "Ourchive"
  productName: "Ourchive"
  productIdentifier: "com.ourchive.client"
  description: "Ourchive desktop client"
  copyright: "(c) Ourchive contributors"
  comments: "Peer-to-peer storage for invite-only groups"
  version: "0.4.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

# ourchive:// links: browser sign-in handoff (ourchive://auth) and one-click enrollment from the
# hub's "Connect a machine" page (ourchive://enroll). Registered by the NSIS installer on Windows,
# Info.plist on macOS and the .desktop file on Linux.
protocols:
  - scheme: ourchive
    description: Ourchive

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Ourchive — Self-hosted pooled cloud storage, previewer, and GPU converter">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e1e1b" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Outer architectural card -->
  <rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="#141413" stroke="#2b2a26" stroke-width="1"/>

  <!-- Subtle grid restricted to the right schematic zone -->
  <rect x="640" y="1" width="559" height="298" rx="13" fill="url(#grid)"/>
  <line x1="640" y1="1" x2="640" y2="299" stroke="#242320" stroke-width="1"/>

  <!-- Left column: Mark, Wordmark, Plain Description, Telemetry Specs -->
  <g transform="translate(56, 56)">
    <!-- Geometric archive mark (flat, solid, no glow) -->
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#1d1c1a" stroke="#33322d" stroke-width="1"/>
    <rect x="8" y="9" width="20" height="6" rx="1.5" fill="#f2f0ea"/>
    <rect x="8" y="18" width="20" height="9" rx="1.5" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="15" y1="22.5" x2="21" y2="22.5" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Wordmark -->
    <text x="50" y="26" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="-0.03em" fill="#f2f0ea">Ourchive</text>

    <!-- Version pill (quiet mono) -->
    <rect x="182" y="7" width="54" height="22" rx="6" fill="#1c1c19" stroke="#2e2d29" stroke-width="1"/>
    <text x="209" y="22" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8f8c83">v0.3.0</text>

    <!-- Headline / One-sentence description -->
    <text x="0" y="84" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#d8d5cc">Self-hosted pooled cloud storage, rich file previewer,</text>
    <text x="0" y="110" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#d8d5cc">isolated share links, and 3-tier GPU media converter.</text>

    <!-- Quiet capability strip -->
    <g transform="translate(0, 152)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8f8c83">
      <circle cx="5" cy="-3.5" r="3.5" fill="#4ade80"/>
      <text x="16" y="0" fill="#b8b5ac">WebRTC P2P</text>
      <text x="104" y="0" fill="#4a4943">/</text>
      <text x="120" y="0" fill="#b8b5ac">0 VPS Egress</text>
      <text x="220" y="0" fill="#4a4943">/</text>
      <text x="236" y="0" fill="#b8b5ac">Crash-Safe Resume</text>
      <text x="376" y="0" fill="#4a4943">/</text>
      <text x="392" y="0" fill="#b8b5ac">Invite-Only</text>
    </g>

    <!-- Subtle footer meta -->
    <text x="0" y="190" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#63615b">Go + SQLite WAL · React + TypeScript · Windows / macOS / Linux</text>
  </g>

  <!-- Right column: Architectural Schematic (Hub + Contributor Nodes + Direct P2P) -->
  <g transform="translate(676, 36)">
    <!-- Hub Control Plane box (top center) -->
    <rect x="136" y="0" width="216" height="58" rx="10" fill="#1a1917" stroke="#2f2e29" stroke-width="1"/>
    <circle cx="154" cy="21" r="3.5" fill="#38bdf8"/>
    <text x="166" y="25" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#f2f0ea">Ourchive Hub</text>
    <text x="154" y="44" font-family="'Geist Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#7d7a72">WSS + yamux · ~2 KB SDP only</text>

    <!-- Control plane dashed lines from Hub to Node & Browser -->
    <path d="M 190 58 L 190 88 L 96 88 L 96 116" fill="none" stroke="#3a3934" stroke-width="1.25" stroke-dasharray="3 3"/>
    <path d="M 298 58 L 298 88 L 392 88 L 392 116" fill="none" stroke="#3a3934" stroke-width="1.25" stroke-dasharray="3 3"/>

    <!-- Contributor Node box (bottom left) -->
    <rect x="0" y="116" width="196" height="108" rx="10" fill="#1a1917" stroke="#2f2e29" stroke-width="1"/>
    <circle cx="18" cy="138" r="3.5" fill="#4ade80"/>
    <text x="30" y="142" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#f2f0ea">Contributor Node</text>
    <text x="18" y="164" font-family="'Geist Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#8f8c83">os.OpenRoot · .part</text>
    <text x="18" y="182" font-family="'Geist Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#8f8c83">GPU ffmpeg · LibreOffice</text>
    <!-- Traffic counter signature -->
    <text x="18" y="206" font-family="'Geist Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#a78bfa">↑ 48.2 MB/s</text>
    <text x="108" y="206" font-family="'Geist Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#4ade80">↓ 12.6 MB/s</text>

    <!-- Direct WebRTC P2P Bridge (center highlight) -->
    <line x1="196" y1="170" x2="292" y2="170" stroke="#38bdf8" stroke-width="1.75"/>
    <polygon points="292,170 285,166 285,174" fill="#38bdf8"/>
    <polygon points="196,170 203,166 203,174" fill="#38bdf8"/>
    <rect x="206" y="147" width="76" height="18" rx="4" fill="#141413" stroke="#284657" stroke-width="1"/>
    <text x="244" y="159.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, monospace" font-size="9.5" fill="#38bdf8">Direct P2P</text>
    <text x="244" y="188" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, monospace" font-size="9.5" fill="#7d7a72">get / put / zip</text>

    <!-- Browser Client box (bottom right) -->
    <rect x="292" y="116" width="196" height="108" rx="10" fill="#1a1917" stroke="#2f2e29" stroke-width="1"/>
    <circle cx="310" cy="138" r="3.5" fill="#4ade80"/>
    <text x="322" y="142" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#f2f0ea">Web Client</text>
    <text x="310" y="164" font-family="'Geist Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#8f8c83">OPFS / IDB cache</text>
    <text x="310" y="182" font-family="'Geist Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#8f8c83">ETag + SHA-256 verify</text>
    <text x="310" y="206" font-family="'Geist Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#38bdf8">Passkeys · OIDC · SSE</text>
  </g>
</svg>

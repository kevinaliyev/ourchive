name: Build Ourchive App

# Manual runs just build. Pushing a client-v* tag also attaches the installers to a DRAFT release
# (review, then publish it; untick "Set as the latest release" so the agent install URLs that use
# releases/latest keep working). The hub's "Get the app" button offers the newest published
# client-v* release when OURCHIVE_CLIENT_RELEASE_REPO=owner/repo is set. The installer file names
# below must match internal/clientdist.Platforms.
on:
  workflow_dispatch:
  push:
    tags:
      - "client-v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go tests (agent core, client core, handoff, hub)
        run: go test -race ./internal/agentcore ./internal/agentstatus ./internal/agentlog ./internal/clientcore ./internal/handoff ./cmd/agent ./cmd/hub
      - name: Type-check web UI
        run: npm --prefix web ci && npm --prefix web exec -- tsc --noEmit

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ourchive-windows-amd64
          - os: macos-latest
            artifact: ourchive-macos-arm64
          - os: ubuntu-24.04
            artifact: ourchive-linux-amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - name: Generate build assets if not committed
        run: test -f build/Taskfile.yml || ./scripts/bootstrap-build-assets.sh
      - name: Resolve Go modules
        run: go mod tidy
      - name: Stamp version
        # The generated Wails Taskfiles hard-code -ldflags, so set the version from a source file.
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
        run: printf 'package main\n\nfunc init() { version = "%s" }\n' "${VERSION#client-}" > version_release.go
      - name: NSIS (Windows installer)
        if: runner.os == 'Windows'
        run: |
          if ! command -v makensis >/dev/null 2>&1; then choco install nsis -y --no-progress; fi
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
      - name: Package
        run: wails3 task package
      - name: Name the installer for release
        # One stable file name per platform so the hub can find it without guessing.
        run: |
          set -euo pipefail
          echo "--- bin/ after packaging:"; ls -la bin
          mkdir -p release
          case "$RUNNER_OS" in
            Windows)
              src=$(find bin -maxdepth 1 -type f -iname '*installer*.exe' | head -n 1)
              [ -n "$src" ] || src=$(find bin -maxdepth 1 -type f -iname '*.exe' | head -n 1)
              [ -n "$src" ] || { echo "no .exe found in bin/"; exit 1; }
              cp "$src" release/ourchive-client-windows-amd64.exe ;;
            macOS)
              app=$(find bin -maxdepth 1 -type d -name '*.app' | head -n 1)
              [ -n "$app" ] || { echo "no .app found in bin/"; exit 1; }
              ditto -c -k --sequesterRsrc --keepParent "$app" release/ourchive-client-macos-arm64.zip ;;
            Linux)
              src=$(find bin -maxdepth 1 -type f -name '*.AppImage' | head -n 1)
              [ -n "$src" ] || { echo "no .AppImage found in bin/"; exit 1; }
              cp "$src" release/ourchive-client-linux-amd64.AppImage ;;
          esac
          ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: client/release/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          make_latest: "false"
          files: dist/**/*
